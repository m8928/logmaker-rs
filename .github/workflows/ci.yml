name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            mcp-server/package-lock.json

      # Built first: the server embeds ui output from core/static.
      - name: Build Frontend
        working-directory: ./ui
        run: |
          npm ci
          npm run check
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build Server
        run: cargo build --release --locked -p logmaker-core

      - name: Build MCP Server
        working-directory: ./mcp-server
        run: |
          npm ci
          npm run build

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build Frontend
        working-directory: ./ui
        run: |
          npm ci
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Plugin DLLs cross-built with the GNU toolchain (e.g. on macOS or Linux)
      # must load in the MSVC-built server.
      - name: Test GNU-built plugin DLL
        env:
          SAMPLE_PLUGIN_TARGET: x86_64-pc-windows-gnu
        run: cargo test --locked -p logmaker-core --test native_plugin

      - name: Build Server
        run: cargo build --release --locked -p logmaker-core

      - name: Smoke test
        shell: pwsh
        run: |
          & target\release\logmaker.exe --daemon
          if ($LASTEXITCODE -ne 1) { throw "--daemon should be refused on Windows" }
          $global:LASTEXITCODE = 0
          $server = Start-Process -FilePath target\release\logmaker.exe -PassThru -NoNewWindow `
            -ArgumentList '--port','19999','--data-root','smoke\data','--plugin-root','smoke\plugins','--log-dir','smoke\logs'
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { $up = (Invoke-RestMethod http://127.0.0.1:19999/actuator/health).status -eq 'UP' }
            catch { Start-Sleep -Milliseconds 500 }
          }
          $ui = (Invoke-WebRequest http://127.0.0.1:19999/ -UseBasicParsing).StatusCode
          Stop-Process -Id $server.Id
          if (-not $up -or $ui -ne 200) { Get-Content smoke\logs\*; throw "server did not start" }
          "health UP, UI $ui"
          Get-Content smoke\logs\*.log | Select-Object -First 3

      - uses: actions/upload-artifact@v4
        with:
          name: logmaker-windows-x86_64
          path: target/release/logmaker.exe
          retention-days: 14

  # Builds and smoke-tests the image; pushes to main and v* tags also publish
  # it to ghcr.io/<owner>/<repo> for linux/amd64 and linux/arm64.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check Kubernetes manifests and Helm chart
        run: |
          kubectl kustomize k8s > /dev/null
          helm lint helm/logmaker
          helm template logmaker helm/logmaker --set timezone=Asia/Seoul > /dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: logmaker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name logmaker -p 19999:19999 logmaker:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:19999/actuator/health && break; sleep 1; done
          curl -sf http://127.0.0.1:19999/actuator/health | grep -q '"UP"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19999/)" = 200
          test "$(docker exec logmaker id -u)" = 10001
          docker stop logmaker
          docker logs logmaker
          docker logs logmaker 2>&1 | grep -q 'shutting down'

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest: main; 3.0.0 and 3.0: tag v3.0.0; sha-<commit>: every push
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: latest=false

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime stage of the arm64 image runs under emulation.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'

      - name: Publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
