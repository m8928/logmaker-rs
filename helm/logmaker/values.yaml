image:
  repository: ghcr.io/m8928/logmaker-rs
  # Empty: the chart's appVersion. Or latest (main), or a commit such as sha-5987f8a.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The image runs as UID/GID 10001; fsGroup makes the volumes writable for it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 19999
  # Fixed port (30000-32767) for type NodePort; empty: chosen by Kubernetes.
  nodePort: null

ingress:
  enabled: false
  className: nginx
  host: logmaker.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

resources:
  requests:
    cpu: 200m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

persistence:
  data:
    enabled: true
    size: 1Gi
    storageClass: ""
  plugins:
    enabled: true
    size: 500Mi
    storageClass: ""

# Log filter passed as RUST_LOG, e.g. "info" or "info,logmaker::debug_sender=warn".
logLevel: info

# Time zone (TZ) for generated timestamps, e.g. Asia/Seoul. Empty: UTC.
timezone: ""

# LogMaker instances, each with its own definitions and volumes, managed from
# one web UI (switch at the top left). A count names them after the release:
# <release>, <release>-2, <release>-3, ... A list names them explicitly, e.g.
# [logmaker-1, logmaker-2, logmaker-3].
instances: 1

# More instances to manage from the web UI: other LogMaker releases in this
# namespace (by name), or name=http://host:port entries.
peers: []

nodeSelector: {}
tolerations: []
affinity: {}
