{{- range $name := include "logmaker.instances" . | fromJsonArray }}
{{- if $.Values.persistence.data.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    app: {{ $name }}
  # Kept on helm uninstall, so definitions survive a reinstall.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $.Values.persistence.data.storageClass }}
  storageClassName: {{ $.Values.persistence.data.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.persistence.data.size }}
{{- end }}
{{- if $.Values.persistence.plugins.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-plugins
  labels:
    app: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $.Values.persistence.plugins.storageClass }}
  storageClassName: {{ $.Values.persistence.plugins.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.persistence.plugins.size }}
{{- end }}
{{- end }}
