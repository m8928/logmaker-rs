{{- $peers := include "logmaker.peers" . }}
{{- range $name := include "logmaker.instances" . | fromJsonArray }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  # One pod per instance: the server keeps its state in memory and in its
  # data volume. Recreate stops the old pod before starting the new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Otherwise a Service named logmaker sets LOGMAKER_PORT=tcp://… in the pod,
      # which the server would read as its port.
      enableServiceLinks: false
      containers:
        - name: logmaker
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 19999
              name: http
          env:
            - name: RUST_LOG
              value: {{ $.Values.logLevel | quote }}
            {{- with $.Values.timezone }}
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            - name: LOGMAKER_INSTANCE_NAME
              value: {{ $name | quote }}
            {{- if contains "," $peers }}
            - name: LOGMAKER_PEERS
              value: {{ $peers | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: plugins
              mountPath: /app/plugins
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data
          {{- if $.Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: plugins
          {{- if $.Values.persistence.plugins.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-plugins
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
